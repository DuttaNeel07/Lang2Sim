[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lang2sim"
version = "2.0.0"
description = "Natural Language to Executable Robot Simulation with Dynamic Stress Testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "shapely>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "jinja2>=3.1.0",
    "textual>=0.70.0",
    "rich>=13.7.0",
    "openai>=1.14.0",
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "mss>=9.0.0",
    "pytest>=7.4.0"
]

[project.optional-dependencies]
# Control API server deps (already baked into the sim image; install on the
# host only to run its tests without Docker).
sim = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1"
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
lang2sim = "lang2sim.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lang2sim*"]
