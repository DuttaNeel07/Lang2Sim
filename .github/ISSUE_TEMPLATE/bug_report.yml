name: Bug Report
description: Create a report to help us reproduce and fix a bug
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please verify you are running against the latest `staging` branch before opening.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the behavior.
      placeholder: |
        1. Run `python scripts/run_sim.py ...`
        2. In TUI, enter `/stress`
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Traceback
      description: Please copy and paste any relevant terminal output or traceback here.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Details about your local setup.
      placeholder: |
        - OS: [e.g. Ubuntu 22.04 / Windows 11 WSL2]
        - Python version: [e.g. 3.11]
        - Docker version: [e.g. 26.1]
        - Branch/Commit: [e.g. staging @ d51ba5e]
    validations:
      required: true
