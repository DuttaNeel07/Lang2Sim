name: tests

# Unit tests (no Docker/ROS). Docker integration tests in tests/integration
# are skipped here unless L2S_INTEGRATION=1.

on:
  push:
    branches: [staging, main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[sim,dev]"
      - run: pytest -q
